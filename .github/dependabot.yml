version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /uptime
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /api
      - /frontend
      - /uptime
    schedule:
      interval: weekly
