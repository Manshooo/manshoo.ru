name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml", "docker-compose.prod.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml", "docker-compose.prod.yml"]

defaults:
  run:
    working-directory: api

jobs:
  checks:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests
        env:
          SECRET_KEY: ci-only-insecure-key
        run: pytest

  image:
    name: push image to ghcr
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          target: prod
          push: true
          tags: |
            ghcr.io/manshooo/manshoo.ru-api:latest
            ghcr.io/manshooo/manshoo.ru-api:${{ github.sha }}

  deploy:
    name: deploy to VPS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, manshoo]
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Sync deploy files
        run: install -m 644 docker-compose.prod.yml /var/www/manshoo/docker-compose.prod.yml
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml pull api postgres
      - name: Migrate
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml run --rm api python manage.py migrate --noinput
      - name: Ensure superuser (idempotent)
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml run --rm api python manage.py createsuperuser --noinput 2>/dev/null || true
      - name: Up
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml up -d api
      - name: Health
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8000/healthz
      - name: Prune dangling images
        run: docker image prune -f
