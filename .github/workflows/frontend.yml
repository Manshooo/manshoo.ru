name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml", "docker-compose.prod.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml", "docker-compose.prod.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: lint & test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Prettier + ESLint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: push image to ghcr
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: true
          tags: |
            ghcr.io/manshooo/manshoo.ru-frontend:latest
            ghcr.io/manshooo/manshoo.ru-frontend:${{ github.sha }}

  deploy:
    name: deploy to VPS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, manshoo]
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Sync deploy files
        run: install -m 644 docker-compose.prod.yml /var/www/manshoo/docker-compose.prod.yml
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull & up
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml pull frontend
          docker compose -f docker-compose.prod.yml up -d frontend
      - name: Health
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/healthz
      - name: Prune dangling images
        run: docker image prune -f
