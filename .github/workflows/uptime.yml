name: uptime

on:
  push:
    branches: [main]
    paths: ["uptime/**", ".github/workflows/uptime.yml", "docker-compose.prod.yml"]
  pull_request:
    paths: ["uptime/**", ".github/workflows/uptime.yml", "docker-compose.prod.yml"]

defaults:
  run:
    working-directory: uptime

jobs:
  checks:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: uptime/go.mod
          cache-dependency-path: uptime/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: uptime
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build ./...

  image:
    name: push image to ghcr
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: uptime
          target: prod
          push: true
          tags: |
            ghcr.io/manshooo/manshoo.ru-uptime:latest
            ghcr.io/manshooo/manshoo.ru-uptime:${{ github.sha }}

  deploy:
    name: deploy to VPS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, manshoo]
    concurrency:
      group: deploy-uptime
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Sync deploy files
        run: |
          install -m 644 docker-compose.prod.yml /var/www/manshoo/docker-compose.prod.yml
          install -m 644 uptime/config.yaml /var/www/manshoo/uptime/config.yaml
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull & up
        run: |
          cd /var/www/manshoo
          docker compose -f docker-compose.prod.yml pull uptime
          docker compose -f docker-compose.prod.yml up -d uptime
      - name: Health
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/healthz
      - name: Prune dangling images
        run: docker image prune -f
