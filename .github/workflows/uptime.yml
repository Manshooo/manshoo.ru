name: uptime

on:
  push:
    branches: [main]
    paths: ["uptime/**", ".github/workflows/uptime.yml"]
  pull_request:
    paths: ["uptime/**", ".github/workflows/uptime.yml"]

defaults:
  run:
    working-directory: uptime

jobs:
  checks:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: uptime/go.mod
          cache-dependency-path: uptime/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: uptime
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build ./...

  image:
    name: push image to ghcr
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: uptime
          target: prod
          push: true
          tags: |
            ghcr.io/manshooo/manshoo.ru-uptime:latest
            ghcr.io/manshooo/manshoo.ru-uptime:${{ github.sha }}
