# Мониторы uptime-чекера. Секреты — через env (см. .env.example):
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_API_BASE, HEARTBEAT_URL.
defaults:
  interval: 60s
  timeout: 10s
  failures_to_down: 3
  tls_expiry_warn_days: 14 # предупредить, если сертификат истекает раньше

monitors:
  - slug: azzb
    name: azzb.ru
    url: https://azzb.ru
    expect_status: 200
  - slug: manshoo
    name: manshoo.ru
    url: https://manshoo.ru
    expect_status: 200
